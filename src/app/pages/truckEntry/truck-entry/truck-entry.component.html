<div class="well">
    <button class="btn-danger" (click)="changeDiv(1)">
      <i class="material-icons">add</i>
    </button>
    <button class="btn-success" (click)="changeDiv(2)">
      <i class="material-icons">desktop_windows</i>
    </button>
</div>

<div class="well" *ngIf="showdiv=='1'">

  <div class="form-group row">
      <div class="col-sm-4 col-xs-4">
    <button mat-raised-button type="button" (click)="leftRight('back')"
      class="btn btn-danger btn-sm btn-just-icon delete">
      <h4><</h4>
    </button>
  </div>
    <div class="col-sm-4 col-xs-4">
      <input type="date" id="uitodayDate" class="form-control" [(ngModel)]="uitodayDate" style="display: none;">
    <h4>{{uitodayDate|date:'dd-MM-yyyy'}}</h4>
  </div>
    <div class="col-sm-4 col-xs-4">
      <button mat-raised-button type="button" (click)="leftRight('ahead')"
        class="btn btn-primary btn-sm btn-just-icon delete">
        <h4>></h4>
      </button>
  </div>
    </div>

    <div class="form-group row">
      <div class="col-sm-6">
        <select class="form-control" [(ngModel)]="partyType" (change)="setParty(j)">
            <option disabled id="">Default</option>
          <option *ngFor="let ii of pts;" value={{ii.value}}>{{ii.viewValue}}</option>
        </select>
      </div>
    </div>
    <hr style="background-color:blue">

  <form [formGroup]="myFormGroup" (ngSubmit)="store(myFormGroup)">


    <div class="form-group row">
      <div class="col-sm-6">
        <input type="text" id="truck" class="form-control"  formControlName="truck" placeholder="TN12AS1234">
      </div>
    </div>

    <div class="form-group row">
      <div class="col-sm-4">
        Party :
        <select style="color: wheat;background-color:black;" class="form-control" formControlName="partyName">
          <option selected disabled value={{partyid}}>{{party}}</option>
          <option *ngFor="let i of parties2;let j = index;" value={{i.name}}>{{i.name}}</option>
        </select>
      </div>
    </div>

    <div class="row">
      
      <div class="form-group" class="col-xs-4 col-sm-4">
        <button type="submit" class="btn btn-primary" [disabled]='!myFormGroup.valid'>
          <i class="material-icons">send</i>
        </button>
      </div>

      <div class="form-group" class="col-xs-4 col-sm-4">
        <button type="button" class="btn btn-danger" (click)="refresh()">
          <i class="material-icons">delete</i>
        </button>

      </div>

    </div>
  </form>



</div>


<div class="well" *ngIf="showdiv=='2'">
    <button class="btn btn-danger" (click)="refresh()"><i class="material-icons">refresh</i></button>

    <div class="well" style="background-color: orange;border-radius: 10vh;" *ngFor="let i of list;let j = index">
      <h3 style="text-align: center;color:black;">{{i.truckno}}</h3>

      <h4>Name : <input style="width:20vh;" type="text" value={{i.name}}  id="name_{{j}}"></h4>
      <h4>PAN : <input style="width:20vh;" type="text" maxlength="10" value={{i.pan}} id="pan_{{j}}"></h4>
      <h4 *ngIf="i.contact==='green'">Contact : <i class="material-icons"  style="color: green;">
          done
          </i></h4>
      <h4 *ngIf="i.contact===''">
        Contact : <input style="width:20vh;" type="number" max="10" value={{i.contact}} id="contact_{{j}}" (keyup)="onChangeContact(j)">
        <button class="btn-danger" (click)="changeContact(i,j)"><i class="material-icons">send</i></button>      
      </h4>
      
      <h4>Type : <select style="width:20vh;" id="toc_{{j}}" class="form-control">
          <option selected disabled>{{i.type}}</option>
          <option value="Open">Open</option>
          <option value="Container">Container</option>
        </select>
      </h4> 

          <button class="btn-danger" (click)="changeData(i,j)"><i class="material-icons">send</i></button>
          <button class="btn-danger" (click)="delete(i,j)"><i class="material-icons">delete</i></button>
    
    </div>
</div>
